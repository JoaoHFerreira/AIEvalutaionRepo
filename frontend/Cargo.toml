[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlElement", "Document", "Window", "Response", "Request", "RequestInit", "RequestMode"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
search_core = { path = "../search_core" }
js-sys = "0.3"
